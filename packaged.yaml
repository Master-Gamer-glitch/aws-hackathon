AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2013-12-31
Description: CrewDesk Backend - Distributed Task Execution with Agent Orchestration
Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: nodejs22.x
    Architectures:
    - arm64
    Environment:
      Variables:
        DYNAMODB_ENDPOINT:
          Fn::If:
          - IsLocal
          - http://localhost:4566
          - ''
        APP_REGION:
          Ref: AWS::Region
Conditions:
  IsLocal:
    Fn::Equals:
    - Ref: Environment
    - local
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - staging
    - prod
    - local
Resources:
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: crewdesk-tasks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: projectId
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      - AttributeName: state
        AttributeType: S
      - AttributeName: leaseOwner
        AttributeType: S
      - AttributeName: leaseExpiry
        AttributeType: N
      KeySchema:
      - AttributeName: projectId
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: StateIndex
        KeySchema:
        - AttributeName: state
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      - IndexName: DeviceIndex
        KeySchema:
        - AttributeName: leaseOwner
          KeyType: HASH
        - AttributeName: leaseExpiry
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
    Metadata:
      SamResourceId: TasksTable
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: crewdesk-projects
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: projectId
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      KeySchema:
      - AttributeName: projectId
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
    Metadata:
      SamResourceId: ProjectsTable
  DevicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: crewdesk-devices
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: deviceId
        AttributeType: S
      - AttributeName: roomId
        AttributeType: S
      - AttributeName: lastHeartbeat
        AttributeType: N
      KeySchema:
      - AttributeName: deviceId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: RoomIndex
        KeySchema:
        - AttributeName: roomId
          KeyType: HASH
        - AttributeName: lastHeartbeat
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
    Metadata:
      SamResourceId: DevicesTable
  CheckpointsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: crewdesk-checkpoints
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: projectId
        AttributeType: S
      - AttributeName: checkpointId
        AttributeType: S
      - AttributeName: taskId
        AttributeType: S
      KeySchema:
      - AttributeName: projectId
        KeyType: HASH
      - AttributeName: checkpointId
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: TaskIndex
        KeySchema:
        - AttributeName: taskId
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
    Metadata:
      SamResourceId: CheckpointsTable
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: crewdesk-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: projectId
        AttributeType: S
      - AttributeName: connectionId
        AttributeType: S
      KeySchema:
      - AttributeName: projectId
        KeyType: HASH
      - AttributeName: connectionId
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
    Metadata:
      SamResourceId: ConnectionsTable
  ClaimTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: crewdesk-claim-task
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-km4tpyldcisu/crewdesk/4ab9cd68e555ebbdd7d04e13b71f7a6f
      Handler: handlers/tasks/claim.claimTaskHandler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TasksTable
      Environment:
        Variables:
          TASKS_TABLE:
            Ref: TasksTable
          DYNAMODB_ENDPOINT:
            Fn::If:
            - IsLocal
            - http://localhost:4566
            - ''
          CONNECTIONS_TABLE:
            Ref: ConnectionsTable
      Events:
        ClaimTask:
          Type: Api
          Properties:
            Path: /tasks/{taskId}/claim
            Method: post
    Metadata:
      SamResourceId: ClaimTaskFunction
  SubmitTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: crewdesk-submit-task
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-km4tpyldcisu/crewdesk/4ab9cd68e555ebbdd7d04e13b71f7a6f
      Handler: handlers/tasks/submit.submitTaskHandler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TasksTable
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          Resource:
          - Fn::Sub: arn:aws:bedrock:${AWS::Region}::foundation-model/*
          - Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
          - Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*
      Environment:
        Variables:
          TASKS_TABLE:
            Ref: TasksTable
          DYNAMODB_ENDPOINT:
            Fn::If:
            - IsLocal
            - http://localhost:4566
            - ''
          CONNECTIONS_TABLE:
            Ref: ConnectionsTable
      Events:
        SubmitTask:
          Type: Api
          Properties:
            Path: /tasks/{taskId}/submit
            Method: post
    Metadata:
      SamResourceId: SubmitTaskFunction
  LeadAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: crewdesk-lead-agent
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-km4tpyldcisu/crewdesk/4ab9cd68e555ebbdd7d04e13b71f7a6f
      Handler: handlers/agents/lead.leadAgentHandler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TasksTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProjectsTable
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          Resource:
          - Fn::Sub: arn:aws:bedrock:${AWS::Region}::foundation-model/*
          - Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
          - Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*
      Environment:
        Variables:
          TASKS_TABLE:
            Ref: TasksTable
          PROJECTS_TABLE:
            Ref: ProjectsTable
          DYNAMODB_ENDPOINT:
            Fn::If:
            - IsLocal
            - http://localhost:4566
            - ''
      Events:
        LeadAgent:
          Type: Api
          Properties:
            Path: /projects/{projectId}/outcomes
            Method: post
    Metadata:
      SamResourceId: LeadAgentFunction
  SweepFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: crewdesk-sweep
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-km4tpyldcisu/crewdesk/4ab9cd68e555ebbdd7d04e13b71f7a6f
      Handler: handlers/events/sweep.sweepHandler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TasksTable
      Environment:
        Variables:
          TASKS_TABLE:
            Ref: TasksTable
          DYNAMODB_ENDPOINT:
            Fn::If:
            - IsLocal
            - http://localhost:4566
            - ''
          CONNECTIONS_TABLE:
            Ref: ConnectionsTable
      Events:
        SweepManual:
          Type: Api
          Properties:
            Path: /sweep
            Method: post
    Metadata:
      SamResourceId: SweepFunction
  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: crewdesk-websocket-connect
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-km4tpyldcisu/crewdesk/4ab9cd68e555ebbdd7d04e13b71f7a6f
      Handler: handlers/websocket/connect.connectHandler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConnectionsTable
      Environment:
        Variables:
          CONNECTIONS_TABLE:
            Ref: ConnectionsTable
    Metadata:
      SamResourceId: WebSocketConnectFunction
  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: crewdesk-websocket-disconnect
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-km4tpyldcisu/crewdesk/4ab9cd68e555ebbdd7d04e13b71f7a6f
      Handler: handlers/websocket/disconnect.disconnectHandler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConnectionsTable
      Environment:
        Variables:
          CONNECTIONS_TABLE:
            Ref: ConnectionsTable
    Metadata:
      SamResourceId: WebSocketDisconnectFunction
  SweepScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
      - Id: SweepFunctionTarget
        Arn:
          Fn::GetAtt:
          - SweepFunction
          - Arn
        RoleArn:
          Fn::GetAtt:
          - EventBridgeRole
          - Arn
    Metadata:
      SamResourceId: SweepScheduleRule
  SweepLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: SweepFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
        - SweepScheduleRule
        - Arn
    Metadata:
      SamResourceId: SweepLambdaPermission
  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: InvokeLambda
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource:
              Fn::GetAtt:
              - SweepFunction
              - Arn
    Metadata:
      SamResourceId: EventBridgeRole
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: CrewDesk WebSocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
    Metadata:
      SamResourceId: WebSocketApi
  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $connect
      Target:
        Fn::Sub: integrations/${WebSocketConnectIntegration}
    Metadata:
      SamResourceId: WebSocketConnectRoute
  WebSocketConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnectFunction.Arn}/invocations
    Metadata:
      SamResourceId: WebSocketConnectIntegration
  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $disconnect
      Target:
        Fn::Sub: integrations/${WebSocketDisconnectIntegration}
    Metadata:
      SamResourceId: WebSocketDisconnectRoute
  WebSocketDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDisconnectFunction.Arn}/invocations
    Metadata:
      SamResourceId: WebSocketDisconnectIntegration
  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
    - WebSocketConnectRoute
    - WebSocketDisconnectRoute
    Properties:
      ApiId:
        Ref: WebSocketApi
    Metadata:
      SamResourceId: WebSocketDeployment
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: WebSocketApi
      DeploymentId:
        Ref: WebSocketDeployment
      StageName:
        Ref: Environment
    Metadata:
      SamResourceId: WebSocketStage
  WebSocketConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: WebSocketConnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
    Metadata:
      SamResourceId: WebSocketConnectPermission
  WebSocketDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: WebSocketDisconnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
    Metadata:
      SamResourceId: WebSocketDisconnectPermission
Outputs:
  TasksTableName:
    Value:
      Ref: TasksTable
    Description: Tasks DynamoDB table name
  ProjectsTableName:
    Value:
      Ref: ProjectsTable
    Description: Projects DynamoDB table name
  ClaimTaskFunctionArn:
    Value:
      Fn::GetAtt:
      - ClaimTaskFunction
      - Arn
    Description: Claim task Lambda ARN
  SubmitTaskFunctionArn:
    Value:
      Fn::GetAtt:
      - SubmitTaskFunction
      - Arn
    Description: Submit task Lambda ARN
  LeadAgentFunctionArn:
    Value:
      Fn::GetAtt:
      - LeadAgentFunction
      - Arn
    Description: Lead agent Lambda ARN
  WebSocketApiEndpoint:
    Value:
      Fn::Sub: wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Description: WebSocket API endpoint for real-time events
  ConnectionsTableName:
    Value:
      Ref: ConnectionsTable
    Description: Connections DynamoDB table name
