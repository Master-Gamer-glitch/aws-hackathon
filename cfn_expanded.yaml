AWSTemplateFormatVersion: '2010-09-09'
Description: CrewDesk Backend - Distributed Task Execution with Agent Orchestration
Conditions:
  IsLocal:
    Fn::Equals:
    - Ref: Environment
    - local
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - staging
    - prod
    - local
Resources:
  WebSocketDisconnectFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action:
          - sts:AssumeRole
          Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: WebSocketDisconnectFunctionRolePolicy0
        PolicyDocument:
          Statement:
          - Action:
            - dynamodb:GetItem
            - dynamodb:DeleteItem
            - dynamodb:PutItem
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:BatchWriteItem
            - dynamodb:BatchGetItem
            - dynamodb:DescribeTable
            - dynamodb:ConditionCheckItem
            Effect: Allow
            Resource:
            - Fn::Sub:
              - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${tableName}
              - tableName:
                  Ref: ConnectionsTable
            - Fn::Sub:
              - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${tableName}/index/*
              - tableName:
                  Ref: ConnectionsTable
      Tags:
      - Key: lambda:createdBy
        Value: SAM
  SubmitTaskFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action:
          - sts:AssumeRole
          Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: SubmitTaskFunctionRolePolicy0
        PolicyDocument:
          Statement:
          - Action:
            - dynamodb:GetItem
            - dynamodb:DeleteItem
            - dynamodb:PutItem
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:BatchWriteItem
            - dynamodb:BatchGetItem
            - dynamodb:DescribeTable
            - dynamodb:ConditionCheckItem
            Effect: Allow
            Resource:
            - Fn::Sub:
              - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${tableName}
              - tableName:
                  Ref: TasksTable
            - Fn::Sub:
              - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${tableName}/index/*
              - tableName:
                  Ref: TasksTable
      - PolicyName: SubmitTaskFunctionRolePolicy1
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - bedrock:InvokeModel
            Resource:
            - Fn::Sub: arn:aws:bedrock:${AWS::Region}::foundation-model/*
            - Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
            - Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*
      Tags:
      - Key: lambda:createdBy
        Value: SAM
  WebSocketDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: WebSocketDisconnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
    Metadata:
      SamResourceId: WebSocketDisconnectPermission
  WebSocketConnectFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action:
          - sts:AssumeRole
          Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: WebSocketConnectFunctionRolePolicy0
        PolicyDocument:
          Statement:
          - Action:
            - dynamodb:GetItem
            - dynamodb:DeleteItem
            - dynamodb:PutItem
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:BatchWriteItem
            - dynamodb:BatchGetItem
            - dynamodb:DescribeTable
            - dynamodb:ConditionCheckItem
            Effect: Allow
            Resource:
            - Fn::Sub:
              - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${tableName}
              - tableName:
                  Ref: ConnectionsTable
            - Fn::Sub:
              - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${tableName}/index/*
              - tableName:
                  Ref: ConnectionsTable
      Tags:
      - Key: lambda:createdBy
        Value: SAM
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: crewdesk-tasks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: projectId
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      - AttributeName: state
        AttributeType: S
      - AttributeName: leaseOwner
        AttributeType: S
      - AttributeName: leaseExpiry
        AttributeType: N
      KeySchema:
      - AttributeName: projectId
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: StateIndex
        KeySchema:
        - AttributeName: state
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      - IndexName: DeviceIndex
        KeySchema:
        - AttributeName: leaseOwner
          KeyType: HASH
        - AttributeName: leaseExpiry
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
    Metadata:
      SamResourceId: TasksTable
  WebSocketDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDisconnectFunction.Arn}/invocations
    Metadata:
      SamResourceId: WebSocketDisconnectIntegration
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: crewdesk-projects
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: projectId
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      KeySchema:
      - AttributeName: projectId
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
    Metadata:
      SamResourceId: ProjectsTable
  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $connect
      Target:
        Fn::Sub: integrations/${WebSocketConnectIntegration}
    Metadata:
      SamResourceId: WebSocketConnectRoute
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: CrewDesk WebSocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
    Metadata:
      SamResourceId: WebSocketApi
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: WebSocketApi
      DeploymentId:
        Ref: WebSocketDeployment
      StageName:
        Ref: Environment
    Metadata:
      SamResourceId: WebSocketStage
  LeadAgentFunction:
    Type: AWS::Lambda::Function
    Metadata:
      SamResourceId: LeadAgentFunction
    Properties:
      Code:
        S3Bucket: aws-sam-cli-managed-default-samclisourcebucket-km4tpyldcisu
        S3Key: crewdesk/4ab9cd68e555ebbdd7d04e13b71f7a6f
      FunctionName: crewdesk-lead-agent
      Handler: handlers/agents/lead.leadAgentHandler
      MemorySize: 512
      Role:
        Fn::GetAtt:
        - LeadAgentFunctionRole
        - Arn
      Runtime: nodejs22.x
      Timeout: 60
      Environment:
        Variables:
          DYNAMODB_ENDPOINT:
            Fn::If:
            - IsLocal
            - http://localhost:4566
            - ''
          APP_REGION:
            Ref: AWS::Region
          TASKS_TABLE:
            Ref: TasksTable
          PROJECTS_TABLE:
            Ref: ProjectsTable
      Tags:
      - Key: lambda:createdBy
        Value: SAM
      Architectures:
      - arm64
  SweepFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action:
          - sts:AssumeRole
          Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: SweepFunctionRolePolicy0
        PolicyDocument:
          Statement:
          - Action:
            - dynamodb:GetItem
            - dynamodb:DeleteItem
            - dynamodb:PutItem
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:BatchWriteItem
            - dynamodb:BatchGetItem
            - dynamodb:DescribeTable
            - dynamodb:ConditionCheckItem
            Effect: Allow
            Resource:
            - Fn::Sub:
              - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${tableName}
              - tableName:
                  Ref: TasksTable
            - Fn::Sub:
              - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${tableName}/index/*
              - tableName:
                  Ref: TasksTable
      Tags:
      - Key: lambda:createdBy
        Value: SAM
  WebSocketConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnectFunction.Arn}/invocations
    Metadata:
      SamResourceId: WebSocketConnectIntegration
  CheckpointsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: crewdesk-checkpoints
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: projectId
        AttributeType: S
      - AttributeName: checkpointId
        AttributeType: S
      - AttributeName: taskId
        AttributeType: S
      KeySchema:
      - AttributeName: projectId
        KeyType: HASH
      - AttributeName: checkpointId
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: TaskIndex
        KeySchema:
        - AttributeName: taskId
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
    Metadata:
      SamResourceId: CheckpointsTable
  ServerlessRestApiProdStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      DeploymentId:
        Ref: ServerlessRestApiDeployment7af7a308d6
      RestApiId:
        Ref: ServerlessRestApi
      StageName: Prod
  LeadAgentFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action:
          - sts:AssumeRole
          Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: LeadAgentFunctionRolePolicy0
        PolicyDocument:
          Statement:
          - Action:
            - dynamodb:GetItem
            - dynamodb:DeleteItem
            - dynamodb:PutItem
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:BatchWriteItem
            - dynamodb:BatchGetItem
            - dynamodb:DescribeTable
            - dynamodb:ConditionCheckItem
            Effect: Allow
            Resource:
            - Fn::Sub:
              - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${tableName}
              - tableName:
                  Ref: TasksTable
            - Fn::Sub:
              - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${tableName}/index/*
              - tableName:
                  Ref: TasksTable
      - PolicyName: LeadAgentFunctionRolePolicy1
        PolicyDocument:
          Statement:
          - Action:
            - dynamodb:GetItem
            - dynamodb:DeleteItem
            - dynamodb:PutItem
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:BatchWriteItem
            - dynamodb:BatchGetItem
            - dynamodb:DescribeTable
            - dynamodb:ConditionCheckItem
            Effect: Allow
            Resource:
            - Fn::Sub:
              - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${tableName}
              - tableName:
                  Ref: ProjectsTable
            - Fn::Sub:
              - arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${tableName}/index/*
              - tableName:
                  Ref: ProjectsTable
      - PolicyName: LeadAgentFunctionRolePolicy2
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - bedrock:InvokeModel
            Resource:
            - Fn::Sub: arn:aws:bedrock:${AWS::Region}::foundation-model/*
            - Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
            - Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*
      Tags:
      - Key: lambda:createdBy
        Value: SAM
  SweepLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: SweepFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
        - SweepScheduleRule
        - Arn
    Metadata:
      SamResourceId: SweepLambdaPermission
  ServerlessRestApiDeployment7af7a308d6:
    Type: AWS::ApiGateway::Deployment
    Properties:
      Description: 'RestApi deployment id: 7af7a308d64e4bfff7d2a083d0ee666cc834e914'
      RestApiId:
        Ref: ServerlessRestApi
      StageName: Stage
  SweepFunction:
    Type: AWS::Lambda::Function
    Metadata:
      SamResourceId: SweepFunction
    Properties:
      Code:
        S3Bucket: aws-sam-cli-managed-default-samclisourcebucket-km4tpyldcisu
        S3Key: crewdesk/4ab9cd68e555ebbdd7d04e13b71f7a6f
      FunctionName: crewdesk-sweep
      Handler: handlers/events/sweep.sweepHandler
      MemorySize: 512
      Role:
        Fn::GetAtt:
        - SweepFunctionRole
