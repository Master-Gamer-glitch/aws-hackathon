            Ref: ServerlessRestApi
          __Stage__: '*'
  ClaimTaskFunction:
    Type: AWS::Lambda::Function
    Metadata:
      SamResourceId: ClaimTaskFunction
    Properties:
      Code:
        S3Bucket: aws-sam-cli-managed-default-samclisourcebucket-km4tpyldcisu
        S3Key: crewdesk/4ab9cd68e555ebbdd7d04e13b71f7a6f
      FunctionName: crewdesk-claim-task
