            - ''
          APP_REGION:
            Ref: AWS::Region
          CONNECTIONS_TABLE:
            Ref: ConnectionsTable
      Tags:
      - Key: lambda:createdBy
        Value: SAM
      Architectures:
      - arm64
  WebSocketConnectFunction:
    Type: AWS::Lambda::Function
