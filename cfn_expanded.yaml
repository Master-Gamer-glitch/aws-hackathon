        Variables:
          DYNAMODB_ENDPOINT:
            Fn::If:
            - IsLocal
            - http://localhost:4566
            - ''
          APP_REGION:
            Ref: AWS::Region
          CONNECTIONS_TABLE:
            Ref: ConnectionsTable
      Tags:
      - Key: lambda:createdBy
        Value: SAM
      Architectures:
      - arm64
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: crewdesk-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: projectId
